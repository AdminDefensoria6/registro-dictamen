<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictámenes (Dual Firestore)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        /* ===== ESTILOS (sin cambios) ===== */
        :root {
            --primary-color: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #06b6d4;
            --text-color: #334155;
            --text-light: #64748b;
            --light-gray: #f8fafc;
            --border-color: #e2e8f0;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-hover: 0 10px 15px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-color);
            line-height: 1.6;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1.2rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(10px);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.7rem;
            opacity: 0.9;
            text-align: center;
            margin-top: 2px;
            line-height: 1.1;
        }

        .monthly-stats {
            display: none;
            overflow-x: auto;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
        }

        .monthly-stats-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 5px;
            min-width: 800px;
        }

        .month-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            min-width: 50px;
        }

        .month-stat-value {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .month-stat-label {
            font-size: 0.6rem;
            opacity: 0.9;
            text-align: center;
            margin-top: 1px;
            line-height: 1;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
            background: var(--white);
            padding: 15px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .filter-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .filter-row {
                flex-direction: row;
            }
        }

        .year-filter, .month-filter, .topic-filter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 16px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        select.form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 16px;
            background-color: var(--white);
            cursor: pointer;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }
        .btn-secondary:hover {
            background-color: #475569;
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .table-container {
            background-color: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 10px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
            font-size: 0.85rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            position: sticky;
            top: 0;
        }

        th:hover {
            background-color: #f1f5f9;
            color: var(--primary-color);
        }

        tr {
            transition: var(--transition);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:nth-child(even) {
            background-color: var(--light-gray);
        }
        tr:hover {
            background-color: #f1f5f9;
        }

        .action-buttons {
            display: flex;
            flex-direction: row;
            gap: 6px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            letter-spacing: 0.3px;
        }

        .btn-view {
            background: linear-gradient(145deg, #0ea5e9, #0284c7);
            color: white;
        }
        .btn-view:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.35);
        }
        .btn-view:active {
            transform: scale(0.96);
        }

        .btn-edit {
            background: linear-gradient(145deg, #f59e0b, #d97706);
            color: white;
        }
        .btn-edit:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
        }
        .btn-edit:active {
            transform: scale(0.96);
        }

        .btn-edit-disabled {
            background: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }
        .btn-edit-disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            padding: 10px;
        }

        .modal-content {
            background-color: var(--white);
            border-radius: var(--radius);
            width: 100%;
            max-width: 95%;
            max-height: 95vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            padding: 20px;
            position: relative;
            animation: modalFadeIn 0.3s ease-out;
        }

        #formModal .modal-content {
            max-width: 750px;
        }

        #viewModal .modal-content {
            max-width: 800px;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .close-btn:hover {
            color: var(--danger-color);
            background-color: #fef2f2;
        }

        .modal-header {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-right: 30px;
        }

        .modal-body {
            margin-bottom: 15px;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-left, .form-right {
            width: 100%;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }

        .date-input {
            font-family: monospace;
            letter-spacing: 1px;
        }
        .date-input:valid {
            border-color: var(--success-color);
        }
        .date-input:invalid:not(:placeholder-shown) {
            border-color: var(--danger-color);
        }

        .content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        .content-tools {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .word-count {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .content-area {
            flex: 1;
            padding: 12px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            border: none;
            resize: none;
            width: 100%;
            font-size: 16px;
        }

        .content-area:focus {
            outline: none;
        }

        .content-pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #f8fafc;
            border-top: 1px solid var(--border-color);
        }

        .page-info {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .page-buttons {
            display: flex;
            gap: 5px;
        }

        .page-btn {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            background-color: var(--white);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-btn:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .page-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .firma-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }

        .firma-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .firma-option input[type="radio"] {
            width: 18px;
            height: 18px;
        }

        .firma-option label {
            cursor: pointer;
            font-weight: 500;
        }

        .dynamic-firma-field {
            margin-top: 10px;
            display: none;
        }
        .dynamic-firma-field.active {
            display: block;
        }

        .subrogante-input {
            margin-top: 10px;
        }

        .expediente-bold {
            font-weight: 700 !important;
        }

        .user-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #f0f9ff;
            color: var(--primary-color);
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid #bae6fd;
            word-break: break-word;
        }

        .firma-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            word-break: break-word;
        }
        .firma-si {
            background-color: #d1fae5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }
        .firma-no {
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
        }
        .firma-subrogante {
            background-color: #e0f2fe;
            color: var(--info-color);
            border: 1px solid #bae6fd;
        }

        .time-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #f0f9ff;
            color: var(--info-color);
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid #bae6fd;
            white-space: normal;
            word-break: break-word;
        }

        .year-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #e0f2fe;
            color: var(--primary-color);
            font-size: 0.7rem;
            font-weight: 600;
        }

        .topic-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .text-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            background-color: #f0f9ff;
            color: var(--info-color);
            border: 1px solid #bae6fd;
        }
        .text-yes {
            background-color: #d1fae5;
            color: #059669;
            border-color: #a7f3d0;
        }
        .text-no {
            background-color: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .source-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            background-color: #e2e8f0;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .source-badge.new {
            background-color: #dbeafe;
            color: #1d4ed8;
            border-color: #93c5fd;
        }
        .source-badge.old {
            background-color: #f1f5f9;
            color: #64748b;
            border-color: #cbd5e1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 15px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--border-color);
        }
        .empty-state p {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--white);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 120px;
        }
        .pagination-btn:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .pagination-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .pagination-info {
            color: var(--text-light);
            font-size: 0.9rem;
            text-align: center;
            min-width: 120px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            background-color: var(--primary-color);
            color: white;
            box-shadow: var(--shadow);
            z-index: 1100;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        .notification.error {
            background-color: var(--danger-color);
        }
        .notification.success {
            background-color: var(--success-color);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .created-date {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 5px;
        }

        @media (max-width: 640px) {
            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
                padding: 6px;
            }
            .stat-item:nth-child(1) {
                grid-column: 1 / span 3;
            }
            .stat-value {
                font-size: 1rem;
            }
            .stat-label {
                font-size: 0.6rem;
            }
            .monthly-stats-grid {
                min-width: 400px;
                gap: 3px;
            }
            .month-stat-item {
                min-width: 30px;
                padding: 2px 1px;
            }
            .month-stat-value {
                font-size: 0.7rem;
            }
            .month-stat-label {
                font-size: 0.5rem;
            }

            .controls-container {
                padding: 10px;
            }
            .search-container {
                flex-direction: column;
            }
            .filter-row {
                flex-direction: column;
                gap: 6px;
            }
            .year-filter, .month-filter, .topic-filter {
                width: 100%;
                justify-content: stretch;
            }
            select.form-input, .search-input {
                font-size: 14px;
                padding: 8px 12px;
            }
            .btn {
                width: 100%;
                padding: 10px;
                font-size: 0.9rem;
            }

            .table-container {
                border-radius: var(--radius-sm);
            }
            table {
                min-width: 700px;
                font-size: 0.75rem;
            }
            th, td {
                padding: 6px 4px;
                max-width: 80px;
            }

            .action-buttons {
                flex-direction: row;
                gap: 4px;
                flex-wrap: nowrap;
            }
            .action-btn {
                padding: 4px 10px;
                font-size: 0.7rem;
                border-radius: 20px;
                gap: 4px;
            }
            .action-btn i {
                font-size: 0.7rem;
            }

            #formModal .modal-content,
            #viewModal .modal-content {

    <!-- SCRIPT CON DOS FIRESTORE Y EDICIÓN DESACTIVADA PARA HISTÓRICOS -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // CONFIGURACIÓN DE FIREBASE (DOS PROYECTOS)
        // ============================================================

        // --- CONFIGURACIÓN DEL PROYECTO ACTUAL (SOLO LECTURA) ---
        const firebaseConfigOld = {
            apiKey: "AIzaSyCA4PlV7FpUZsRSqJaFQrCRoKyShwpPQac",
            authDomain: "librodictamen.firebaseapp.com",
            projectId: "librodictamen",
            storageBucket: "librodictamen.firebasestorage.app",
            messagingSenderId: "5128868565",
            appId: "1:5128868565:web:f13be4d1b408526ebd085c"
        };

        // --- CONFIGURACIÓN DEL NUEVO PROYECTO (LECTURA + ESCRITURA) ---
        // [COMPLETA AQUÍ CON TUS DATOS DE LA NUEVA API]
        const firebaseConfigNew = {
            apiKey: "TU_NUEVA_API_KEY",
            authDomain: "tu-nuevo-proyecto.firebaseapp.com",
            projectId: "tu-nuevo-proyecto",
            storageBucket: "tu-nuevo-proyecto.appspot.com",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar ambas apps
        let dbOld = null;
        let dbNew = null;
        let firebaseOldReady = false;
        let firebaseNewReady = false;

        try {
            firebase.initializeApp(firebaseConfigOld, 'oldApp');
            dbOld = firebase.app('oldApp').firestore();
            firebaseOldReady = true;
            console.log('✅ Proyecto antiguo conectado (solo lectura)');
        } catch (e) {
            console.warn('⚠️ No se pudo conectar al proyecto antiguo', e);
        }

        try {
            firebase.initializeApp(firebaseConfigNew, 'newApp');
            dbNew = firebase.app('newApp').firestore();
            firebaseNewReady = true;
            console.log('✅ Nuevo proyecto conectado (lectura + escritura)');
        } catch (e) {
            console.warn('⚠️ No se pudo conectar al nuevo proyecto', e);
            toast('No se pudo conectar al nuevo Firestore. Los cambios no se guardarán.', 'error');
        }

        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let oldRecords = [];
        let newRecords = [];
        let allRecords = [];
        let filtered = [];
        let currentPage = 1;
        const perPage = 10;
        let editingId = null;

        // ============================================================
        // REFERENCIAS DOM
        // ============================================================
        const $ = id => document.getElementById(id);
        const body = $('tableBody');
        const emptyState = $('emptyState');
        const emptyBtn = $('emptyBtn');
        const search = $('searchInput');
        const filterYear = $('filterYear');
        const filterMonth = $('filterMonth');
        const filterTopic = $('filterTopic');
        const prevPage = $('prevPage');
        const nextPage = $('nextPage');
        const pageInfo = $('pageInfo');
        const btnNew = $('btnNew');

        const formModal = $('formModal');
        const formTitle = $('formTitle');
        const editId = $('editId');
        const fSubject = $('fSubject');
        const fDate = $('fDate');
        const fTopic = $('fTopic');
        const fUser = $('fUser');
        const fExpediente = $('fExpediente');
        const fContent = $('fContent');
        const fSubrogante = $('fSubrogante');
        const subroganteField = $('subroganteField');
        const firmaRadios = document.querySelectorAll('input[name="firma"]');
        const fCreatedAt = $('fCreatedAt');
        const createdAtGroup = $('createdAtGroup');
        const submitBtn = $('submitBtn');
        const submitText = $('submitText');
        const submitSpinner = $('submitSpinner');
        const cancelForm = $('cancelForm');
        const closeForm = $('closeForm');
        const clearContentBtn = $('clearContent');
        const wordCount = $('wordCount');

        const viewModal = $('viewModal');
        const viewTitle = $('viewTitle');
        const viewContent = $('viewContent');
        const closeView = $('closeView');

        const statTotal = $('statTotal');
        const statTrim1 = $('statTrim1');
        const statTrim2 = $('statTrim2');
        const statTrim3 = $('statTrim3');
        const statTrim4 = $('statTrim4');
        const monthlyStats = $('monthlyStats');
        const monthlyStatsGrid = $('monthlyStatsGrid');

        // ============================================================
        // UTILIDADES
        // ============================================================
        function formatDateDisplay(str) {
            if (!str) return '';
            const parts = str.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return str;
        }

        function formatDateForStorage(str) {
            const parts = str.split('/');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return str;
        }

        function isValidDate(d) {
            return /^\d{2}\/\d{2}\/\d{4}$/.test(d) && !isNaN(new Date(d.split('/').reverse().join('-')));
        }

        function getYearFromDate(str) {
            if (!str) return '';
            if (str.includes('/')) return str.split('/')[2];
            if (str.includes('-')) return str.split('-')[0];
            return '';
        }

        function getMonthFromDate(str) {
            if (!str) return 0;
            if (str.includes('/')) return parseInt(str.split('/')[1], 10);
            if (str.includes('-')) return parseInt(str.split('-')[1], 10);
            return 0;
        }

        function formatTimestamp(ts) {
            if (!ts) return 'No disponible';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit',
                year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        function toast(msg, type = 'info') {
            const old = document.querySelector('.notification');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = `notification ${type}`;
            div.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${msg}`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        function showSpinner(show) {
            submitText.classList.toggle('hidden', show);
            submitSpinner.style.display = show ? 'inline-block' : 'none';
            submitBtn.disabled = show;
        }

        function getTimestamp() {
            if (dbNew) return firebase.firestore.Timestamp.now();
            return new Date().toISOString();
        }

        // ============================================================
        // FUNCIONES DE OBTENCIÓN DEL MÁXIMO NÚMERO
        // ============================================================
        async function getMaxNumber(dbInstance) {
            if (!dbInstance) return 0;
            try {
                const snap = await dbInstance.collection('dictamenes')
                    .orderBy('number', 'desc')
                    .limit(1)
                    .get();
                if (snap.empty) return 0;
                return snap.docs[0].data().number || 0;
            } catch (e) {
                console.warn('Error al obtener máximo número:', e);
                return 0;
            }
        }

        // ============================================================
        // FUNCIÓN PARA OBTENER EL SIGUIENTE NÚMERO (USA EL NUEVO PROYECTO)
        // ============================================================
        async function getNextNumber() {
            if (!dbNew) {
                if (allRecords.length === 0) return 1;
                let max = 0;
                allRecords.forEach(r => { if (r.number > max) max = r.number; });
                return max + 1;
            }

            const counterRef = dbNew.collection('contadores').doc('global');
            try {
                const result = await dbNew.runTransaction(async (tx) => {
                    const doc = await tx.get(counterRef);
                    let current = 1;
                    if (doc.exists) {
                        current = doc.data().currentNumber + 1;
                    } else {
                        const maxOld = await getMaxNumber(dbOld);
                        const maxNew = await getMaxNumber(dbNew);
                        current = Math.max(maxOld, maxNew) + 1;
                    }
                    tx.set(counterRef, { currentNumber: current });
                    return current;
                });
                return result;
            } catch (e) {
                console.warn('Transacción falló, usando fallback:', e);
                const maxOld = await getMaxNumber(dbOld);
                const maxNew = await getMaxNumber(dbNew);
                return Math.max(maxOld, maxNew) + 1;
            }
        }

        // ============================================================
        // CARGA DE DATOS DESDE AMBAS FUENTES
        // ============================================================
        function loadData() {
            if (dbOld) {
                dbOld.collection('dictamenes')
                    .orderBy('number', 'desc')
                    .onSnapshot(snapshot => {
                        oldRecords = [];
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            data.id = doc.id;
                            data._source = 'old';
                            oldRecords.push(data);
                        });
                        combineAndRender();
                    }, err => {
                        console.error('Error en snapshot antiguo:', err);
                        toast('Error al leer datos antiguos. Modo local.', 'error');
                    });
            }

            if (dbNew) {
                dbNew.collection('dictamenes')
                    .orderBy('number', 'desc')
                    .onSnapshot(snapshot => {
                        newRecords = [];
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            data.id = doc.id;
                            data._source = 'new';
                            newRecords.push(data);
                        });
                        combineAndRender();
                    }, err => {
                        console.error('Error en snapshot nuevo:', err);
                        toast('Error al leer datos del nuevo proyecto.', 'error');
                    });
            } else {
                toast('El nuevo proyecto no está configurado. No se podrán guardar cambios.', 'error');
            }
        }

        function combineAndRender() {
            const map = new Map();
            oldRecords.forEach(r => map.set(r.id, r));
            newRecords.forEach(r => map.set(r.id, r));
            allRecords = Array.from(map.values());
            allRecords.sort((a, b) => (b.number || 0) - (a.number || 0));

            applyFiltersAndRender();
            updateStatsAndMonths();
            populateYearFilter();
        }

        // ============================================================
        // FILTROS Y RENDER
        // ============================================================
        function applyFiltersAndRender() {
            const q = search.value.trim().toLowerCase();
            const year = filterYear.value;
            const month = filterMonth.value;
            const topic = filterTopic.value;

            filtered = allRecords.filter(r => {
                if (year !== 'todos' && r.year !== year) return false;
                if (month !== 'todos') {
                    const m = getMonthFromDate(r.dictamenDate);
                    if (m !== parseInt(month, 10)) return false;
                }
                if (topic !== 'todos' && r.topic !== topic) return false;
                if (q) {
                    const searchable =
                        `${r.number} ${r.year} ${r.subject} ${r.topic} ${r.assignedUser} ${r.expediente} ${r.content} ${r.firmaDefensor} ${r.firmaDefensorSubrogante} ${formatDateDisplay(r.dictamenDate)}`
                        .toLowerCase();
                    return searchable.includes(q);
                }
                return true;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const start = (currentPage - 1) * perPage;
            const pageItems = filtered.slice(start, start + perPage);

            if (filtered.length === 0) {
                body.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyBtn.onclick = () => openForm();
            } else {
                emptyState.classList.add('hidden');
                let html = '';
                pageItems.forEach(r => {
                    const firmaText = r.firmaDefensor === 'No' && r.firmaDefensorSubrogante ? 'Subrogante' : (r.firmaDefensor ||
                        'Sí');
                    const firmaCls = r.firmaDefensor === 'No' ? (r.firmaDefensorSubrogante ? 'firma-subrogante' :
                        'firma-no') : 'firma-si';
                    const hasText = r.content && r.content.trim().length > 0;
                    const created = formatTimestamp(r.createdAt);
                    const isOld = r._source === 'old';
                    const sourceLabel = isOld ? 'Histórico' : 'Nuevo';
                    const sourceCls = isOld ? 'old' : 'new';

                    // Botón de editar: solo visible para nuevos
                    const editBtn = isOld ?
                        `<span class="action-btn btn-edit-disabled" title="Los dictámenes históricos no se pueden editar"><i class="fas fa-pen"></i> Editar</span>` :
                        `<button class="action-btn btn-edit" data-action="edit" data-id="${r.id}"><i class="fas fa-pen"></i> Editar</button>`;

                    html += `
                        <tr>
                            <td><strong>${r.number}</strong></td>
                            <td><span class="year-badge">${r.year}</span></td>
                            <td>${r.subject || ''}</td>
                            <td>${formatDateDisplay(r.dictamenDate)}</td>
                            <td><span class="topic-badge">${r.topic || ''}</span></td>
                            <td>${r.assignedUser ? `<span class="user-badge">${r.assignedUser}</span>` : ''}</td>
                            <td><span class="firma-badge ${firmaCls}">${firmaText}</span></td>
                            <td><strong>${r.expediente || ''}</strong></td>
                            <td><span class="text-badge ${hasText ? 'text-yes' : 'text-no'}">${hasText ? 'Sí' : 'No'}</span></td>
                            <td><span class="time-badge">${created}</span></td>
                            <td><span class="source-badge ${sourceCls}">${sourceLabel}</span></td>
                            <td>
                                <div class="action-buttons">
                                    <button class="action-btn btn-view" data-action="view" data-id="${r.id}"><i class="fas fa-eye"></i> Ver</button>
                                    ${editBtn}
                                </div>
                            </td>
                        </tr>
                    `;
                });
                body.innerHTML = html;
            }

            document.querySelectorAll('[data-action="view"]').forEach(b => b.onclick = () => viewRecord(b.dataset.id));
            document.querySelectorAll('[data-action="edit"]').forEach(b => b.onclick = () => openForm(b.dataset.id));

            const totalPages = Math.ceil(filtered.length / perPage) || 1;
            pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;
            prevPage.disabled = currentPage === 1;
            nextPage.disabled = currentPage === totalPages;
        }

        // ============================================================
        // KPIs: TRIMESTRES Y MESES
        // ============================================================
        function updateStatsAndMonths() {
            const list = filtered.length > 0 ? filtered : allRecords;
            statTotal.textContent = list.length;

            let t1 = 0, t2 = 0, t3 = 0, t4 = 0;
            const monthCounts = Array(12).fill(0);
            const monthNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

            list.forEach(r => {
                const m = getMonthFromDate(r.dictamenDate);
                if (m >= 1 && m <= 12) monthCounts[m - 1]++;
                if (m >= 1 && m <= 3) t1++;
                else if (m >= 4 && m <= 6) t2++;
                else if (m >= 7 && m <= 9) t3++;
                else if (m >= 10 && m <= 12) t4++;
            });

            statTrim1.textContent = t1;
            statTrim2.textContent = t2;
            statTrim3.textContent = t3;
            statTrim4.textContent = t4;

            monthlyStatsGrid.innerHTML = '';
            monthCounts.forEach((count, index) => {
                const item = document.createElement('div');
                item.className = 'month-stat-item';
                item.innerHTML = `
                    <span class="month-stat-value">${count}</span>
                    <span class="month-stat-label">${monthNames[index]}</span>
                `;
                monthlyStatsGrid.appendChild(item);
            });

            const hasData = monthCounts.some(c => c > 0);
            monthlyStats.style.display = hasData ? 'block' : 'none';
        }

        function populateYearFilter() {
            const years = new Set();
            allRecords.forEach(r => years.add(r.year));
            const current = new Date().getFullYear();
            for (let y = current - 5; y <= current + 5; y++) years.add(y.toString());
            const sorted = Array.from(years).sort((a, b) => b - a);
            filterYear.innerHTML = '<option value="todos">Año</option>' + sorted.map(y => `<option value="${y}">${y}</option>`).join(
                '');
        }

        // ============================================================
        // FORMULARIO (solo permite editar si el registro es 'new')
        // ============================================================
        function openForm(id = null) {
            if (id) {
                const r = allRecords.find(rec => rec.id === id);
                if (!r) { toast('Registro no encontrado', 'error'); return; }
                if (r._source === 'old') {
                    toast('No se pueden editar dictámenes históricos.', 'info');
                    return;
                }
            }

            editingId = id;
            formModal.style.display = 'flex';
            formTitle.textContent = id ? 'Editar Dictamen' : 'Nuevo Dictamen';
            submitText.textContent = id ? 'Actualizar' : 'Guardar';
            editId.value = id || '';
            createdAtGroup.style.display = 'none';

            if (id) {
                const r = allRecords.find(rec => rec.id === id);
                if (!r) { toast('Registro no encontrado', 'error'); return; }
                fSubject.value = r.subject || '';
                fDate.value = formatDateDisplay(r.dictamenDate);
                fTopic.value = r.topic || '';
                fUser.value = r.assignedUser || '';
                fExpediente.value = r.expediente || '';
                fContent.value = r.content || '';
                if (r.firmaDefensor === 'No') {
                    document.querySelector('input[name="firma"][value="No"]').checked = true;
                    subroganteField.classList.add('active');
                    fSubrogante.value = r.firmaDefensorSubrogante || '';
                } else {
                    document.querySelector('input[name="firma"][value="Sí"]').checked = true;
                    subroganteField.classList.remove('active');
                    fSubrogante.value = '';
                }
                if (r.createdAt) {
                    createdAtGroup.style.display = 'block';
                    fCreatedAt.textContent = formatTimestamp(r.createdAt);
                }
            } else {
                fSubject.value = '';
                const today = new Date();
                fDate.value =
                    `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
                fTopic.value = '';
                fUser.value = '';
                fExpediente.value = '';
                fContent.value = '';
                document.querySelector('input[name="firma"][value="Sí"]').checked = true;
                subroganteField.classList.remove('active');
                fSubrogante.value = '';
            }
            updateWordCount();
        }

        function closeFormModal() {
            formModal.style.display = 'none';
            editingId = null;
        }

        function updateWordCount() {
            const text = fContent.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCount.textContent = `${words} palabras`;
        }

        // ============================================================
        // VISTA DE CONTENIDO
        // ============================================================
        function viewRecord(id) {
            const r = allRecords.find(rec => rec.id === id);
            if (!r) return toast('Registro no encontrado', 'error');
            let firmaHtml = '';
            if (r.firmaDefensor === 'No' && r.firmaDefensorSubrogante) {
                firmaHtml =
                    `<p><strong>Firma Titular:</strong> No</p><p><strong>Subrogante:</strong> ${r.firmaDefensorSubrogante}</p>`;
            } else {
                firmaHtml = `<p><strong>Firma Titular:</strong> ${r.firmaDefensor || 'Sí'}</p>`;
            }
            viewTitle.textContent = `Dictamen ${r.number}/${r.year}`;
            viewContent.innerHTML = `
                <p><strong>Asunto:</strong> ${r.subject}</p>
                <p><strong>Fecha:</strong> ${formatDateDisplay(r.dictamenDate)}</p>
                <p><strong>Temática:</strong> ${r.topic}</p>
                <p><strong>Usuario:</strong> ${r.assignedUser}</p>
                ${firmaHtml}
                <p><strong>Expediente:</strong> ${r.expediente}</p>
                <p><strong>Registrado:</strong> ${formatTimestamp(r.createdAt)}</p>
                <p><strong>Origen:</strong> ${r._source === 'old' ? 'Histórico (solo lectura)' : 'Nuevo (editable)'}</p>
                <hr style="margin:16px 0; border-color:#e2e8f0;" />
                <div class="full-text" style="background:#f8fafc;padding:16px;border-radius:12px;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto;border:1px solid #e2e8f0;">${r.content || ''}</div>
            `;
            viewModal.style.display = 'flex';
        }

        // ============================================================
        // GUARDADO (SOLO EN EL NUEVO PROYECTO)
        // ============================================================
        async function saveRecord(data, id = null) {
            if (!dbNew) {
                throw new Error('El nuevo proyecto no está configurado. No se puede guardar.');
            }
            if (id) {
                await dbNew.collection('dictamenes').doc(id).update(data);
            } else {
                const ref = await dbNew.collection('dictamenes').add(data);
                return ref.id;
            }
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        function setupEventListeners() {
            btnNew.addEventListener('click', () => openForm());
            emptyBtn.addEventListener('click', () => openForm());

            cancelForm.addEventListener('click', closeFormModal);
            closeForm.addEventListener('click', closeFormModal);
            formModal.addEventListener('click', function(e) { if (e.target === this) closeFormModal(); });

            closeView.addEventListener('click', () => viewModal.style.display = 'none');
            viewModal.addEventListener('click', function(e) { if (e.target === this) viewModal.style.display = 'none'; });

            prevPage.addEventListener('click', () => { if (currentPage > 1) { currentPage--;
                    renderTable(); } });
            nextPage.addEventListener('click', () => { const total = Math.ceil(filtered.length / perPage); if (currentPage < total) {
                    currentPage++;
                    renderTable(); } });

            [search, filterYear, filterMonth, filterTopic].forEach(el => {
                el.addEventListener('input', applyFiltersAndRender);
                el.addEventListener('change', applyFiltersAndRender);
            });

            fDate.addEventListener('input', function(e) {
                let v = this.value.replace(/\D/g, '');
                if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
                if (v.length > 5) v = v.slice(0, 5) + '/' + v.slice(5);
                this.value = v;
            });

            firmaRadios.forEach(r => {
                r.addEventListener('change', function() {
                    if (this.value === 'No') subroganteField.classList.add('active');
                    else {
                        subroganteField.classList.remove('active');
                        fSubrogante.value = '';
                    }
                });
            });

            fContent.addEventListener('input', updateWordCount);
            clearContentBtn.addEventListener('click', () => { fContent.value = '';
                updateWordCount(); });

            document.getElementById('dictamenForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const subject = fSubject.value.trim();
                const dateStr = fDate.value.trim();
                const topic = fTopic.value;
                const user = fUser.value;
                const expediente = fExpediente.value.trim();
                const content = fContent.value.trim();

                if (!subject) return toast('Asunto es obligatorio', 'error');
                if (!isValidDate(dateStr)) return toast('Fecha inválida (DD/MM/AAAA)', 'error');
                if (!topic) return toast('Seleccione una temática', 'error');
                if (!user) return toast('Seleccione un usuario', 'error');
                if (!expediente) return toast('Expediente es obligatorio', 'error');
                if (!content) return toast('El contenido no puede estar vacío', 'error');

                const firma = document.querySelector('input[name="firma"]:checked');
                if (!firma) return toast('Seleccione firma defensor', 'error');
                const firmaVal = firma.value;
                let subrogante = '';
                if (firmaVal === 'No') {
                    subrogante = fSubrogante.value.trim();
                    if (!subrogante) return toast('Indique el nombre del subrogante', 'error');
                }

                showSpinner(true);
                try {
                    const year = getYearFromDate(dateStr);
                    const data = {
                        subject,
                        dictamenDate: formatDateForStorage(dateStr),
                        topic,
                        assignedUser: user,
                        expediente,
                        content,
                        firmaDefensor: firmaVal,
                        firmaDefensorSubrogante: subrogante,
                        year: year
                    };

                    if (editingId) {
                        data.updatedAt = getTimestamp();
                        await saveRecord(data, editingId);
                        toast('Dictamen actualizado', 'success');
                    } else {
                        const number = await getNextNumber();
                        data.number = number;
                        data.createdAt = getTimestamp();
                        await saveRecord(data);
                        toast('Dictamen creado', 'success');
                    }
                    closeFormModal();
                } catch (err) {
                    console.error(err);
                    toast('Error al guardar: ' + err.message, 'error');
                }
                showSpinner(false);
            });
        }

        // ============================================================
        // INICIO
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            setupEventListeners();
        });
    </script>
</body>
</html>
